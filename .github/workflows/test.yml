name: test

on:
  # Toda branch: o trabalho da fusao vive numa branch de trabalho, e o CI tem de a
  # ver sem esperar por um PR. Custo aceite em troca: um PR do proprio repo gera
  # dois runs, um pelo push e outro pelo pull_request.
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test
